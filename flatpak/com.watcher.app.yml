app-id: com.watcher.app
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: watcher
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: watcher
    buildsystem: simple
    build-commands:
      - install -D watcher /app/bin/watcher
      - install -D com.watcher.app.desktop /app/share/applications/com.watcher.app.desktop
      - install -D com.watcher.app.metainfo.xml /app/share/metainfo/com.watcher.app.metainfo.xml
      - install -D icon.png /app/share/icons/hicolor/512x512/apps/com.watcher.app.png
      - install -D 128x128.png /app/share/icons/hicolor/128x128/apps/com.watcher.app.png
      - install -D 32x32.png /app/share/icons/hicolor/32x32/apps/com.watcher.app.png
    sources:
      - type: file
        path: ../src-tauri/target/release/watcher
      - type: file
        path: com.watcher.app.desktop
      - type: file
        path: com.watcher.app.metainfo.xml
      - type: file
        path: ../src-tauri/icons/icon.png
      - type: file
        path: ../src-tauri/icons/128x128.png
      - type: file
        path: ../src-tauri/icons/32x32.png
