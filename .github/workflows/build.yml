name: Build Tauri App

on:
  push:
    branches: [ "main", "master", "tauri" ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'windows'
          - platform: 'ubuntu-22.04'
            name: 'linux'

    runs-on: ${{ matrix.platform }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Next.js frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: watcher-v__VERSION__
          releaseName: 'Watcher App v__VERSION__'
          releaseBody: |
            ## Watcher Desktop v__VERSION__
            - Universal cross-device sync with Google Account (Desktop, Web, and Mobile).
            - Native Windows (.exe / .msi) and Linux (.deb / .AppImage) packaging.
            - AI Companion with persistent chats and responsive input.
            - Enhanced details page, franchise timeline banners, and themed season selector.
            - Full light and dark theme support with universal scrollbar suppression.
            
            Download the appropriate installer below for your operating system:
            - **Windows**: `.exe` or `.msi`
            - **Linux**: `.deb` (Debian/Ubuntu/Mint) or `.AppImage` (Universal Linux)
          releaseDraft: true
          prerelease: false

      - name: Upload Windows Executable directly to Actions
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Watcher-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

      - name: Upload Linux DEB directly to Actions
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: Watcher-Linux-DEB
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7

      - name: Upload Linux AppImage directly to Actions
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: Watcher-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

